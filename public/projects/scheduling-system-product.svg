<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Sistema de Agendamento product surface</title>
  <desc id="description">Source-verified product view showing a barber scheduling calendar, service choices and operational dashboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7da2ff"/>
      <stop offset="1" stop-color="#46d9ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <g opacity=".16" stroke="#91a6c7">
    <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
  </g>
  <text x="92" y="84" fill="#7da2ff" font-family="monospace" font-size="18" letter-spacing="4">SOURCE-VERIFIED PRODUCT VIEW / 01</text>
  <text x="92" y="160" fill="#f2f6ff" font-family="Arial, sans-serif" font-size="62" font-weight="650">Sistema de Agendamento</text>
  <text x="96" y="207" fill="#9aa9bf" font-family="monospace" font-size="17" letter-spacing="2">CUSTOMER BOOKING + BARBER OPERATIONS</text>

  <g transform="translate(90 270)">
    <rect width="950" height="520" rx="18" fill="#0b111b" stroke="#7188ac" stroke-opacity=".55"/>
    <rect width="950" height="66" rx="18" fill="#111b2a"/>
    <circle cx="32" cy="33" r="6" fill="#ff758a"/><circle cx="54" cy="33" r="6" fill="#ffd778"/><circle cx="76" cy="33" r="6" fill="#77e2b2"/>
    <text x="112" y="41" fill="#eef3fb" font-family="Arial, sans-serif" font-size="21" font-weight="700">STYLUS / scheduling workspace</text>

    <g transform="translate(30 96)">
      <text x="0" y="26" fill="#eef3fb" font-family="Arial, sans-serif" font-size="24" font-weight="650">Available schedule</text>
      <text x="648" y="24" fill="#8fa1ba" font-family="monospace" font-size="14">WEEK / SERVICES</text>
      <g transform="translate(0 58)">
        <rect width="610" height="334" rx="12" fill="#0f1724" stroke="#485c7b"/>
        <g fill="#8fa1ba" font-family="monospace" font-size="13" text-anchor="middle">
          <text x="95" y="36">MON</text><text x="200" y="36">TUE</text><text x="305" y="36">WED</text><text x="410" y="36">THU</text><text x="515" y="36">FRI</text>
        </g>
        <g stroke="#30415c"><path d="M42 56h526M42 112h526M42 168h526M42 224h526M42 280h526"/><path d="M147 56v224M252 56v224M357 56v224M462 56v224"/></g>
        <g fill="url(#signal)" filter="url(#glow)"><rect x="58" y="75" width="74" height="18" rx="9"/><rect x="267" y="131" width="74" height="18" rx="9"/><rect x="372" y="187" width="74" height="18" rx="9"/><rect x="477" y="243" width="74" height="18" rx="9"/></g>
      </g>
      <g transform="translate(642 58)">
        <rect width="248" height="100" rx="12" fill="#111b2a" stroke="#415574"/>
        <text x="22" y="30" fill="#7da2ff" font-family="monospace" font-size="13">01 / SERVICE</text>
        <text x="22" y="65" fill="#eef3fb" font-family="Arial, sans-serif" font-size="20">Choose a service</text>
        <rect y="118" width="248" height="100" rx="12" fill="#111b2a" stroke="#415574"/>
        <text x="22" y="148" fill="#7da2ff" font-family="monospace" font-size="13">02 / TIME</text>
        <text x="22" y="183" fill="#eef3fb" font-family="Arial, sans-serif" font-size="20">Select availability</text>
        <rect y="236" width="248" height="98" rx="12" fill="#111b2a" stroke="#415574"/>
        <text x="22" y="266" fill="#7da2ff" font-family="monospace" font-size="13">03 / CONFIRM</text>
        <text x="22" y="301" fill="#eef3fb" font-family="Arial, sans-serif" font-size="20">Create booking</text>
      </g>
    </g>
  </g>

  <g transform="translate(1090 270)">
    <rect width="420" height="520" rx="18" fill="#0b111b" stroke="#7188ac" stroke-opacity=".55"/>
    <text x="34" y="52" fill="#7da2ff" font-family="monospace" font-size="14" letter-spacing="2">OPERATIONS / DASHBOARD</text>
    <text x="34" y="101" fill="#eef3fb" font-family="Arial, sans-serif" font-size="31" font-weight="650">Schedule signals</text>
    <g transform="translate(34 142)">
      <rect width="352" height="132" rx="12" fill="#111b2a" stroke="#415574"/>
      <path d="M24 102C84 89 104 44 162 60s79 15 166-34" fill="none" stroke="url(#signal)" stroke-width="5"/>
      <circle cx="162" cy="60" r="7" fill="#edf4ff"/>
      <text x="24" y="30" fill="#8fa1ba" font-family="monospace" font-size="13">BOOKINGS / CANCELLATIONS</text>
      <rect y="154" width="168" height="136" rx="12" fill="#111b2a" stroke="#415574"/>
      <circle cx="84" cy="222" r="43" fill="none" stroke="#2a3b57" stroke-width="18"/>
      <path d="M84 179a43 43 0 0 1 38 63" fill="none" stroke="#7da2ff" stroke-width="18"/>
      <rect x="184" y="154" width="168" height="136" rx="12" fill="#111b2a" stroke="#415574"/>
      <g fill="#7da2ff"><rect x="214" y="223" width="19" height="42"/><rect x="249" y="195" width="19" height="70"/><rect x="284" y="176" width="19" height="89"/></g>
      <text x="0" y="330" fill="#8fa1ba" font-family="monospace" font-size="13">REST API / MYSQL / GOOGLE CALENDAR</text>
    </g>
  </g>
</svg>
